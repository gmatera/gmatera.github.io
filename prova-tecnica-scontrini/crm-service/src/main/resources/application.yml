server:
  port: 8083

spring:
  application:
    name: crm-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/crm
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: crm-service
      auto-offset-reset: earliest

logging:
  structured:
    format:
      console: ecs
