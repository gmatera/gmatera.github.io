server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3306/account_db?allowPublicKeyRetrieval=true&useSSL=false
    username: account
    password: account
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:29092

logging:
  structured:
    format:
      console: ecs

app:
  zone: Europe/Rome

outbox:
  publish-delay-ms: 1000
